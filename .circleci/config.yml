version: 2
jobs:
  build:
    docker:
      - image: cimg/openjdk:8.0
    resource_class: small
    working_directory: ~/repo

    environment:
      MAVEN_OPTS: -Xmx1024m -XX:+UseSerialGC
      TERM: dumb

    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - run: mvn -B -ntp package

      - save_cache:
          paths:
            - ~/.m2/repository
          key: v1-dependencies-{{ checksum "pom.xml" }}

      - run: mkdir artifacts && cp target/*-shaded.jar artifacts

      - store_artifacts:
          path: artifacts
